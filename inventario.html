<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario - ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/inventario.css">
</head>
<body>
    <div id="app-container">
        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="brand">Mi ERP</div>
            <nav class="nav-menu">
                <a href="inventario.html" class="nav-link active">📦 Inventario</a>
                <a href="movimientos.html" class="nav-link">📊 Movimientos</a>
            </nav>
            <div class="user-info mt-auto">
                <span id="user-email-display" class="d-block text-truncate small"></span>
                <button onclick="logout()" class="btn btn-danger btn-sm w-100 mt-2">Salir</button>
            </div>
        </aside>

        <!-- CONTENIDO PRINCIPAL -->
        <main class="main-content">
            <header class="view-header">
                <h2>Gestión de Inventario</h2>
                <div class="action-buttons">
                    <button onclick="copiarEnlacePublico()" class="btn btn-success">🔗 Compartir Catálogo</button>
                    <button onclick="abrirModalMovimiento()" class="btn btn-warning text-white">🔄 Movimiento</button>
                    <button onclick="abrirModalProducto()" class="btn btn-primary">+ Nuevo Producto</button>
                </div>
            </header>

            <!-- BARRA DE BÚSQUEDA Y FILTROS -->
            <div class="card p-3 shadow-sm mb-3">
                <div class="row align-items-end">
                    <div class="col-md-6 mb-2 mb-md-0">
                        <label class="form-label text-muted small mb-1">Buscar Producto</label>
                        <input type="text" id="inv-buscador" class="form-control" placeholder="🔍 Nombre o descripción..." oninput="filtrarInventario()">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-muted small mb-1">Filtrar por Categoría</label>
                        <select id="inv-filtro-categoria" class="form-select" onchange="filtrarInventario()">
                            <option value="">Todas las categorías</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="card p-3 shadow-sm">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Foto</th>
                            <th>Producto</th>
                            <th>Categoría</th>
                            <th>Variantes / Stock</th>
                            <th>Stock Total</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-inventario"></tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- MODALES (Se mantienen igual que antes) -->
    <!-- ... (Copia aquí todos tus modales de producto, categoría, movimiento y confirmación) ... -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/inventario.js"></script>
</body>
</html>
