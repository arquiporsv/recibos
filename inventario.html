<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario - ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/inventario.css">
</head>
<body>
    <div id="app-container">
        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="brand">Mi ERP</div>
            <nav class="nav-menu">
                <button class="nav-link active">📦 Inventario</button>
            </nav>
            <div class="user-info mt-auto">
                <span id="user-email-display" class="d-block text-truncate small"></span>
                <button onclick="logout()" class="btn btn-danger btn-sm w-100 mt-2">Salir</button>
            </div>
        </aside>

        <!-- CONTENIDO PRINCIPAL -->
        <main class="main-content">
            <header class="view-header">
                <h2>Gestión de Inventario</h2>
                <div class="action-buttons">
                    <button onclick="copiarEnlacePublico()" class="btn btn-success">🔗 Compartir Catálogo</button>
                    <button onclick="abrirModalMovimiento()" class="btn btn-warning text-white">🔄 Movimiento</button>
                    <button onclick="abrirModalProducto()" class="btn btn-primary">+ Nuevo Producto</button>
                </div>
            </header>

            <div class="card p-3 shadow-sm">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Foto</th>
                            <th>Producto</th>
                            <th>Categoría</th>
                            <th>Variantes / Stock</th>
                            <th>Dañadas / Amarillas</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-inventario"></tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- MODALES -->
    <div id="modals-container">
        <!-- Modal Producto -->
        <div class="modal fade" id="modal-producto" tabindex="-1">
            <div class="modal-dialog modal-lg">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="modal-prod-titulo">Nuevo Producto</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label>Nombre:</label>
                                <input type="text" id="prod-nombre" class="form-control">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label>Categoría:</label>
                                <div class="input-group">
                                    <select id="prod-categoria" class="form-select"></select>
                                    <button class="btn btn-outline-secondary" onclick="abrirModalCategoria()">⚙️</button>
                                </div>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label>Descripción:</label>
                            <textarea id="prod-descripcion" class="form-control" rows="2"></textarea>
                        </div>
                        <div class="mb-3">
                            <label>Enlace Foto (URL):</label>
                            <input type="url" id="prod-foto-url" class="form-control" oninput="actualizarPreviewFoto()">
                            <div id="preview-foto-container" class="mt-2" style="display: none;">
                                <img id="preview-foto" src="" class="img-preview">
                            </div>
                        </div>

                        <!-- CHECKBOX POSITIVO Y NEGATIVO -->
                        <div class="form-check form-switch mb-3 bg-light p-2 rounded">
                            <input class="form-check-input" type="checkbox" id="prod-check-pos-neg" onchange="togglePosNegInputs()">
                            <label class="form-check-label fw-bold" for="prod-check-pos-neg">¿Tiene Positivo y Negativo? (Mismo precio/medida)</label>
                        </div>

                        <hr>
                        <h6>Variantes (Medidas / Precios)</h6>
                        <div id="contenedor-variantes"></div>
                        <button onclick="agregarFilaVariante()" class="btn btn-sm btn-outline-primary mt-2 mb-3">+ Añadir Medida</button>

                        <!-- CHECKBOX DAÑADAS -->
                        <div class="form-check form-switch mb-3 bg-light p-2 rounded">
                            <input class="form-check-input" type="checkbox" id="prod-check-danadas" onchange="toggleDanadasSection()">
                            <label class="form-check-label fw-bold" for="prod-check-danadas">¿Registrar Ítems Dañados / Amarillas?</label>
                        </div>

                        <!-- SECCIÓN DAÑADAS (Oculta por defecto) -->
                        <div id="seccion-danadas" style="display: none;" class="p-3 border rounded bg-white mb-3">
                            <h6 class="text-danger">Registro de Dañadas / Amarillas</h6>
                            <div class="row align-items-end mb-3">
                                <div class="col-md-5">
                                    <label class="small">Seleccionar Medida / Tipo:</label>
                                    <select id="danadas-medida" class="form-select form-select-sm">
                                        <!-- Se llena dinámicamente -->
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label class="small">Cantidad:</label>
                                    <input type="number" id="danadas-cantidad" class="form-control form-control-sm" min="1" value="1">
                                </div>
                                <div class="col-md-3">
                                    <button onclick="agregarItemDanado()" class="btn btn-sm btn-outline-danger w-100">+ Agregar</button>
                                </div>
                            </div>
                            <ul class="list-group list-group-flush" id="lista-danadas">
                                <!-- Lista temporal de dañadas antes de guardar -->
                            </ul>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button onclick="guardarProducto()" class="btn btn-primary">Guardar</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Modal Categoría -->
        <div class="modal fade" id="modal-categoria" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header"><h5 class="modal-title">Categorías</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                    <div class="modal-body">
                        <div class="input-group mb-3">
                            <input type="text" id="nueva-categoria-nombre" class="form-control" placeholder="Nueva...">
                            <button class="btn btn-primary" onclick="guardarCategoria()">Agregar</button>
                        </div>
                        <ul class="list-group" id="lista-categorias"></ul>
                    </div>
                </div>
            </div>
        </div>

        <!-- Modal Movimiento -->
        <div class="modal fade" id="modal-movimiento" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header"><h5 class="modal-title">Movimiento de Stock</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label>Producto:</label>
                            <select id="mov-producto" class="form-select" onchange="cargarVariantesMovimiento()"></select>
                        </div>
                        <div class="mb-3">
                            <label>Variante:</label>
                            <select id="mov-variante" class="form-select"></select>
                        </div>
                        <!-- Selector de Positivo/Negativo (solo aparece si el producto lo tiene) -->
                        <div class="mb-3" id="mov-tipo-stock-container" style="display: none;">
                            <label>Tipo de Stock a Mover:</label>
                            <select id="mov-tipo-stock" class="form-select">
                                <option value="positivo">Positivo (Terminado)</option>
                                <option value="negativo">Negativo (Molde)</option>
                            </select>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label>Tipo Movimiento:</label>
                                <select id="mov-tipo" class="form-select">
                                    <option value="entrada">Entrada</option>
                                    <option value="salida">Salida</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label>Cantidad:</label>
                                <input type="number" id="mov-cantidad" class="form-control" value="1" min="1">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label>Comentario:</label>
                            <input type="text" id="mov-comentario" class="form-control form-control-sm">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button onclick="registrarMovimiento()" class="btn btn-primary">Registrar</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Modal Confirmación -->
        <div class="modal fade" id="modal-confirmacion" tabindex="-1">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header"><h5 class="modal-title">Confirmación</h5></div>
                    <div class="modal-body" id="confirmacion-mensaje"></div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="button" class="btn btn-danger" id="btn-confirmar-accion">Sí, continuar</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/inventario.js"></script>
</body>
</html>
