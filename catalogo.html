<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Público</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/catalogo.css">
</head>
<body class="bg-light">
    <header class="public-header shadow-sm mb-4">
        <div class="container py-3">
            <h1 class="h3 mb-0 text-white">Catálogo de Productos</h1>
        </div>
    </header>

    <main class="container pb-5">
        <section class="filters-section bg-white p-3 rounded shadow-sm mb-4">
            <div class="row align-items-end">
                <div class="col-md-6 mb-2 mb-md-0">
                    <label class="form-label text-muted small mb-1">Buscar</label>
                    <input type="text" id="public-buscador" class="form-control" placeholder="🔍 Escribe el nombre..." oninput="renderizarCatalogoPublico()">
                </div>
                <div class="col-md-4">
                    <label class="form-label text-muted small mb-1">Categoría</label>
                    <select id="public-filtro-categoria" class="form-select" onchange="renderizarCatalogoPublico()">
                        <option value="">Todas</option>
                    </select>
                </div>
                <div class="col-md-2 text-md-end text-center mt-3 mt-md-0">
                    <span id="public-contador" class="badge bg-primary fs-6">0 Ítems</span>
                </div>
            </div>
        </section>

        <section class="catalog-section">
            <div class="row" id="public-inventario-grid"></div>
        </section>
    </main>

    <script type="module" src="js/catalogo.js"></script>
</body>
</html>
