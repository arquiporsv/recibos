<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movimientos - ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/inventario.css">
</head>
<body>
    <div id="app-container">
        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="brand">Mi ERP</div>
            <nav class="nav-menu">
                <a href="inventario.html" class="nav-link">📦 Inventario</a>
                <a href="movimientos.html" class="nav-link active">📊 Movimientos</a>
            </nav>
            <div class="user-info mt-auto">
                <span id="user-email-display" class="d-block text-truncate small"></span>
                <button onclick="logout()" class="btn btn-danger btn-sm w-100 mt-2">Salir</button>
            </div>
        </aside>

        <!-- CONTENIDO PRINCIPAL -->
        <main class="main-content">
            <header class="view-header">
                <h2>Historial de Movimientos</h2>
            </header>

            <!-- FILTROS -->
            <div class="card p-3 shadow-sm mb-3">
                <div class="row align-items-end">
                    <div class="col-md-4 mb-2 mb-md-0">
                        <label class="form-label text-muted small mb-1">Buscar (Producto o Comentario)</label>
                        <input type="text" id="mov-buscador" class="form-control" placeholder="🔍 Escribe aquí..." oninput="filtrarMovimientos()">
                    </div>
                    <div class="col-md-3 mb-2 mb-md-0">
                        <label class="form-label text-muted small mb-1">Tipo de Movimiento</label>
                        <select id="mov-filtro-tipo" class="form-select" onchange="filtrarMovimientos()">
                            <option value="">Todos</option>
                            <option value="entrada">Entradas</option>
                            <option value="salida">Salidas</option>
                        </select>
                    </div>
                    <div class="col-md-3 mb-2 mb-md-0">
                        <label class="form-label text-muted small mb-1">Desde Fecha</label>
                        <input type="date" id="mov-filtro-fecha" class="form-control" onchange="filtrarMovimientos()">
                    </div>
                    <div class="col-md-2 text-end">
                        <button onclick="limpiarFiltrosMov()" class="btn btn-outline-secondary w-100">Limpiar</button>
                    </div>
                </div>
            </div>

            <div class="card p-3 shadow-sm">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Fecha / Hora</th>
                            <th>Producto</th>
                            <th>Medida</th>
                            <th>Tipo</th>
                            <th>Cantidad</th>
                            <th>Comentario</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-movimientos"></tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- MODAL CONFIRMACIÓN (Requerido por firebase.js) -->
    <div class="modal fade" id="modal-confirmacion" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header"><h5 class="modal-title">Confirmación</h5></div>
                <div class="modal-body" id="confirmacion-mensaje"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-danger" id="btn-confirmar-accion">Sí, continuar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/movimientos.js"></script>
</body>
</html>
