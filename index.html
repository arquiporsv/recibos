<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERP - Inventario</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- PANTALLA DE LOGIN -->
    <div id="auth-container" class="auth-container">
        <div class="auth-box shadow">
            <h2 class="text-center mb-4">Acceso al Sistema</h2>
            <input type="email" id="auth-email" class="form-control mb-3" placeholder="Correo electrónico">
            <input type="password" id="auth-password" class="form-control mb-3" placeholder="Contraseña">
            <button onclick="login()" class="btn btn-primary w-100 mb-2">Ingresar</button>
            <button onclick="register()" class="btn btn-secondary w-100">Registrarse</button>
            <p id="auth-message" class="text-danger mt-3 text-center"></p>
        </div>
    </div>

    <!-- VISTA PÚBLICA (Solo lectura) -->
    <div id="public-container" style="display: none; width: 100%; min-height: 100vh; background: #f8f9fa; padding: 20px;">
        <div class="container">
            <h2 class="text-center my-4" id="public-title">Catálogo de Inventario</h2>
            <div class="row" id="public-inventario-grid">
                <!-- Se llena con JS -->
            </div>
        </div>
    </div>

    <!-- APLICACIÓN PRINCIPAL (Privada) -->
    <div id="app-container" style="display: none;">
        <div class="sidebar">
            <div class="brand">Mi ERP</div>
            <button class="nav-link active">📦 Inventario</button>
            <div class="user-info mt-auto">
                <span id="user-email-display"></span>
                <button onclick="logout()" class="btn btn-danger btn-sm w-100 mt-2">Salir</button>
            </div>
        </div>

        <div class="main-content">
            <div class="view-section">
                <div class="header-actions">
                    <h2>Gestión de Inventario</h2>
                    <div>
                        <button onclick="copiarEnlacePublico()" class="btn btn-success">🔗 Compartir Catálogo</button>
                        <button onclick="abrirModalMovimiento()" class="btn btn-warning text-white">🔄 Movimiento de Stock</button>
                        <button onclick="abrirModalProducto()" class="btn btn-primary">+ Nuevo Producto</button>
                    </div>
                </div>

                <div class="card p-3">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Foto</th>
                                <th>Producto</th>
                                <th>Categoría</th>
                                <th>Variantes (Medida / Precio / Stock)</th>
                                <th>Stock Total</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-inventario"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL: CREAR/EDITAR PRODUCTO -->
    <div class="modal fade" id="modal-producto" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modal-prod-titulo">Nuevo Producto</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label>Nombre del Producto:</label>
                            <input type="text" id="prod-nombre" class="form-control" placeholder="Ej. Camisa Polo">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label>Categoría:</label>
                            <div class="input-group">
                                <select id="prod-categoria" class="form-select"></select>
                                <button class="btn btn-outline-secondary" onclick="abrirModalCategoria()" title="Gestionar Categorías">⚙️</button>
                            </div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label>Enlace Directo de la Foto (URL):</label>
                        <input type="url" id="prod-foto-url" class="form-control" placeholder="https://ejemplo.com/foto.jpg" oninput="actualizarPreviewFoto()">
                        <div id="preview-foto-container" class="mt-2" style="display: none;">
                            <img id="preview-foto" src="" style="max-width: 100px; max-height: 100px; border-radius: 4px; object-fit: cover;">
                        </div>
                    </div>

                    <hr>
                    <h6>Variantes (Medidas/Tamaños)</h6>
                    <div id="contenedor-variantes"></div>
                    <button onclick="agregarFilaVariante()" class="btn btn-sm btn-outline-primary mt-2">+ Añadir Medida</button>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button onclick="guardarProducto()" class="btn btn-primary">Guardar Producto</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL: GESTIONAR CATEGORÍAS -->
    <div class="modal fade" id="modal-categoria" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Gestionar Categorías</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="input-group mb-3">
                        <input type="text" id="nueva-categoria-nombre" class="form-control" placeholder="Nueva categoría...">
                        <button class="btn btn-primary" onclick="guardarCategoria()">Agregar</button>
                    </div>
                    <ul class="list-group" id="lista-categorias"></ul>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL: MOVIMIENTO DE STOCK -->
    <div class="modal fade" id="modal-movimiento" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Movimiento de Stock</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label>Producto:</label>
                        <select id="mov-producto" class="form-select" onchange="cargarVariantesMovimiento()">
                            <option value="">-- Seleccionar --</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label>Variante / Medida:</label>
                        <select id="mov-variante" class="form-select">
                            <option value="">-- Seleccione producto primero --</option>
                        </select>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label>Tipo:</label>
                            <select id="mov-tipo" class="form-select">
                                <option value="entrada">Entrada (Ingreso)</option>
                                <option value="salida">Salida (Egreso/Venta)</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label>Cantidad:</label>
                            <input type="number" id="mov-cantidad" class="form-control" min="1" value="1">
                        </div>
                    </div>
                    <hr>
                    <p class="text-muted small">Opcional (Relacionado a DTE):</p>
                    <div class="mb-2">
                        <label>Código de Generación:</label>
                        <input type="text" id="mov-codigo-gen" class="form-control form-control-sm" placeholder="Ej. ABC-123...">
                    </div>
                    <div class="mb-2">
                        <label>N° de DTE:</label>
                        <input type="text" id="mov-num-dte" class="form-control form-control-sm" placeholder="Ej. DTE-01-...">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button onclick="registrarMovimiento()" class="btn btn-primary">Registrar Movimiento</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de Confirmación Personalizado (Bootstrap) -->
    <div class="modal fade" id="modal-confirmacion" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Confirmación</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="confirmacion-mensaje"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-danger" id="btn-confirmar-accion">Sí, continuar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
