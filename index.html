<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-dark d-flex align-items-center justify-content-center vh-100">
    <div class="auth-box shadow bg-white p-5 rounded">
        <h2 class="text-center mb-4">Acceso al Sistema</h2>
        <input type="email" id="auth-email" class="form-control mb-3" placeholder="Correo electrónico">
        <input type="password" id="auth-password" class="form-control mb-3" placeholder="Contraseña">
        <button onclick="login()" class="btn btn-primary w-100 mb-2">Ingresar</button>
        <button onclick="register()" class="btn btn-secondary w-100">Registrarse</button>
        <p id="auth-message" class="text-danger mt-3 text-center small"></p>
    </div>

    <script type="module" src="js/auth.js"></script>
</body>
</html>
