<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERP - Inventario</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div id="auth-container" class="auth-container">
        <div class="auth-box">
            <h2>Acceso al Sistema</h2>
            <input type="email" id="auth-email" placeholder="Correo electrónico">
            <input type="password" id="auth-password" placeholder="Contraseña">
            <button onclick="login()">Ingresar</button>
            <button onclick="register()" class="btn-secondary">Registrarse</button>
            <p id="auth-message" class="error-msg"></p>
        </div>
    </div>

    <div id="app-container" style="display: none;">
        <div class="sidebar">
            <div class="brand">Mi ERP</div>
            <button class="nav-link active">📦 Inventario</button>
            <div class="user-info">
                <span id="user-email-display"></span>
                <button onclick="logout()" class="btn-clear btn-sm" style="margin-top:10px;">Salir</button>
            </div>
        </div>

        <div class="main-content">
            <div class="view-section">
                <div class="header-actions">
                    <h2>Gestión de Inventario</h2>
                    <div>
                        <button onclick="abrirModalMovimiento()" class="btn-draft">🔄 Movimiento de Stock</button>
                        <button onclick="abrirModalProducto()" class="btn-pdf">+ Nuevo Producto</button>
                    </div>
                </div>

                <div class="card">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Foto</th>
                                <th>Producto</th>
                                <th>Categoría</th>
                                <th>Variantes (Medida / Precio / Stock)</th>
                                <th>Stock Total</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-inventario"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL: CREAR/EDITAR PRODUCTO -->
    <div id="modal-producto" class="modal">
        <div class="modal-content" style="width: 60%; max-width: 800px;">
            <span class="close" onclick="cerrarModalProducto()">&times;</span>
            <h2 id="modal-prod-titulo">Nuevo Producto</h2>
            
            <div class="grid-2-col">
                <div>
                    <label>Nombre del Producto:</label>
                    <input type="text" id="prod-nombre" placeholder="Ej. Camisa Polo">
                </div>
                <div>
                    <label>Categoría:</label>
                    <input type="text" id="prod-categoria" placeholder="Ej. Ropa">
                </div>
            </div>

            <div style="margin: 15px 0;">
                <label>Enlace Directo de la Foto (URL):</label>
                <input type="url" id="prod-foto-url" placeholder="https://ejemplo.com/foto.jpg" oninput="actualizarPreviewFoto()">
                <div id="preview-foto-container" style="margin-top: 10px; display: none;">
                    <img id="preview-foto" src="" style="max-width: 100px; max-height: 100px; border-radius: 4px; object-fit: cover;">
                </div>
            </div>

            <hr>
            <h4>Variantes (Medidas/Tamaños)</h4>
            <div id="contenedor-variantes"></div>
            <button onclick="agregarFilaVariante()" class="btn-draft btn-sm" style="margin-bottom: 15px;">+ Añadir Medida</button>

            <div class="modal-footer">
                <button onclick="guardarProducto()" class="btn-pdf" id="btn-guardar-prod">Guardar Producto</button>
            </div>
        </div>
    </div>

    <!-- MODAL: MOVIMIENTO DE STOCK -->
    <div id="modal-movimiento" class="modal">
        <div class="modal-content">
            <span class="close" onclick="cerrarModalMovimiento()">&times;</span>
            <h2>Movimiento de Stock</h2>
            
            <label>Producto:</label>
            <select id="mov-producto" onchange="cargarVariantesMovimiento()">
                <option value="">-- Seleccionar --</option>
            </select>

            <label>Variante / Medida:</label>
            <select id="mov-variante">
                <option value="">-- Seleccione producto primero --</option>
            </select>

            <div class="grid-2-col" style="margin-top: 15px;">
                <div>
                    <label>Tipo de Movimiento:</label>
                    <select id="mov-tipo">
                        <option value="entrada">Entrada (Ingreso)</option>
                        <option value="salida">Salida (Egreso/Venta)</option>
                    </select>
                </div>
                <div>
                    <label>Cantidad:</label>
                    <input type="number" id="mov-cantidad" min="1" value="1">
                </div>
            </div>

            <div class="modal-footer">
                <button onclick="registrarMovimiento()" class="btn-pdf">Registrar Movimiento</button>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
